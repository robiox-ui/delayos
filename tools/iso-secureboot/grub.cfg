# DelayOS live/install medium, started through shim (Secure Boot) by the DelayOS-signed GRUB of
# delayos-sb-general. Written by tools/iso-secureboot.sh to /EFI/DelayOS/grub.cfg (the prefix built
# into that GRUB) in the EFI partition image and on the ISO 9660 file system. docs/secure-boot.md
#
# GRUB under shim cannot load modules from disk: only built-in commands are used here.

# The device GRUB was started from, as a hint for the search below
set live=
set hint=
regexp --set=1:hint '^\(([^)]+)\)' "${cmdpath}"

# The volume with the live system: ISO 9660 on a DVD or a dd-written USB stick, FAT/exFAT/NTFS on a
# stick that an ISO tool filled by copying the files
if [ -n "${hint}" ]; then
    search --no-floppy --set=live --file '@SEARCH_FILE@' --hint "${hint}"
else
    search --no-floppy --set=live --file '@SEARCH_FILE@'
fi

if [ -z "${live}" ]; then
    echo 'DelayOS: the live medium was not found (no volume with @SEARCH_FILE@).'
    echo 'Press Enter to open the firmware setup.'
    read delayos_key
    fwsetup
else
    set root="${live}"
    # archiso finds the medium again by this file system UUID
    probe --set ARCHISO_UUID --fs-uuid "${live}"
    export ARCHISO_UUID

    # Korean menu texts need the graphical terminal and a font with Hangul (GNU Unifont)
    if loadfont "(${live})/boot/grub/fonts/unicode.pf2"; then
        set gfxmode=auto
        set gfxpayload=keep
        terminal_output gfxterm
        set delayos_ko=1
    fi

    # Straight into the live system, no menu (timeout 0: GRUB does not look at Esc then). Shift held
    # down shows the menu on firmware that reports modifier keys.
    set default=delayos
    set timeout=0
    set timeout_style=hidden
    if keystatus --shift; then
        set timeout=-1
        set timeout_style=menu
    fi

    if [ "${delayos_ko}" = 1 ]; then
        set t_start='DelayOS 시작 (체험 / 설치)'
        set t_fw='UEFI 펌웨어 설정'
        set t_reboot='다시 시작'
        set t_off='끄기'
    else
        set t_start='Start DelayOS (live / install)'
        set t_fw='UEFI firmware settings'
        set t_reboot='Restart'
        set t_off='Power off'
    fi

    menuentry "${t_start}" --class delayos --class gnu-linux --class os --id delayos {
        set gfxpayload=keep
        linux /@INSTALL_DIR@/boot/@ARCH@/vmlinuz-linux-delayos archisobasedir=@INSTALL_DIR@ archisosearchuuid=${ARCHISO_UUID} @LIVE_OPTS@
        initrd /@INSTALL_DIR@/boot/@ARCH@/initramfs-linux-delayos.img
    }
    menuentry "${t_fw}" --id uefi-firmware {
        fwsetup
    }
    menuentry "${t_reboot}" {
        reboot
    }
    menuentry "${t_off}" {
        halt
    }
fi
