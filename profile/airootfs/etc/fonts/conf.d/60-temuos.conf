<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  TEMUOS font setup: Inter for Latin, Noto Sans CJK KR for Hangul/Han (Korean UI).
  Inter has no Hangul glyphs, so every lookup of Inter (and the generic families) gets
  Noto Sans CJK KR as the very next font. Without this, Qt/fontconfig fall back to whatever
  CJK face sorts first (JP/SC/HK variants, or a bold face), which mixes glyph shapes and weights.
-->
<fontconfig>
  <!-- Inter (static and variable) -> Noto Sans CJK KR -->
  <alias binding="strong">
    <family>Inter</family>
    <prefer><family>Inter</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Inter Variable</family>
    <prefer><family>Inter Variable</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Inter Display</family>
    <prefer><family>Inter Display</family><family>Noto Sans CJK KR</family></prefer>
  </alias>

  <!-- Generic families: sans-serif = Inter + Noto Sans CJK KR -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif CJK KR</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Noto Sans Mono CJK KR</family></prefer>
  </alias>

  <!-- Han text tagged Korean: use the KR cut when a JP/SC/TC/HK cut was asked for -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family" compare="contains"><string>Noto Sans CJK</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK KR</string></edit>
  </match>
</fontconfig>
