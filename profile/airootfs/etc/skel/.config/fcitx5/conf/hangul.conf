# Windows-style Korean IME: 두벌식, 한자 key / Right Ctrl for hanja, word-level hanja like Windows
Keyboard=Dubeolsik
HanjaMode=False
WordCommit=False
AutoReorder=True

# key lists are sections in fcitx5 (a plain "HanjaModeToggleKey=Hangul_Hanja" is read as an empty list)
[HanjaModeToggleKey]
0=Hangul_Hanja
1=F9
