; TEMUOS_LINUX Gaming mode — applied automatically to every Steam/Lutris game
[general]
renice=10
softrealtime=auto
ioprio=0
inhibit_screensaver=1
disable_splitlock=1

[filter]
; empty = all games

[gpu]
apply_gpu_optimisations=accept-responsibility
gpu_device=0
; AMD: force highest power state while a game runs
amd_performance_level=high
; NVIDIA: maximum performance PowerMizer mode
nv_powermizer_mode=1

[cpu]
park_cores=no
pin_cores=yes

[custom]
start=/usr/local/bin/temu-gamemode hook-start
end=/usr/local/bin/temu-gamemode hook-end
script_timeout=10
