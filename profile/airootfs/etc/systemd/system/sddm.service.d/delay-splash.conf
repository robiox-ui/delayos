# DelayOS: no black gap between the boot splash and the login screen / desktop.
# Stock order: plymouth-quit.service (splash off, console back) -> sddm starts -> seconds of black
# until the greeter or the autologin session has drawn. Here the splash stays on screen while SDDM
# starts (the way GDM does it):
#   - Conflicts= takes plymouth-quit.service out of the boot transaction
#   - plymouth deactivate: plymouthd lets go of the display (DRM master) but leaves its picture up
#   - delay-splash-handoff.service ends plymouth with --retain-splash once the compositor of the
#     greeter or of the session runs (15 s at most)
#   - if SDDM cannot start, plymouth-quit.service runs after all and the console is visible
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-start.service
OnFailure=plymouth-quit.service
Wants=delay-splash-handoff.service

[Service]
ExecStartPre=-/usr/bin/plymouth deactivate
