# Live ISO: init the pacman keyring in the background instead of holding back the desktop.
# Type=exec allows only one ExecStart=, so both pacman-key steps run from a single shell.
[Unit]
After=
After=etc-pacman.d-gnupg.mount
Wants=
[Service]
Type=exec
ExecStart=
ExecStart=/usr/bin/sh -c '/usr/bin/pacman-key --init && /usr/bin/pacman-key --populate'
