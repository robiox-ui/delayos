#!/hint/bash
# TEMUOS_LINUX build flags for AUR / makepkg - same as CachyOS's generic x86-64 builders
# (CachyOS docker-makepkg: -O3 -pipe -fno-plt + Arch hardening, -flto=auto, zstd --ultra -20).
# Kept at -march=x86-64 so packages run on every 64-bit CPU. For your own PC only you can
# change it to -march=native (or x86-64-v3) here.
CFLAGS="-march=x86-64 -mtune=generic -O3 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
LTOFLAGS="-flto=auto"
RUSTFLAGS="-C opt-level=3"
MAKEFLAGS="-j$(nproc)"
COMPRESSZST=(zstd -c -T0 --ultra -20 -)
