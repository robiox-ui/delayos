# TEMUOS_LINUX Lite — Windows-like keys on a tiny footprint
set $mod Mod4
output * bg /usr/share/wallpapers/TemuCurrent/contents/images/3840x2160.svg fill
font pango:Inter 10
default_border pixel 2
gaps inner 6
client.focused #4D6BFE #1a1f27 #e6e8eb #4D6BFE #4D6BFE
client.unfocused #232934 #161b22 #8b93a1 #232934 #232934

input type:touchpad { tap enabled
  natural_scroll disabled }

bindsym $mod+space exec fuzzel
bindsym $mod+e exec foot -e sh -c 'ls ~; exec bash'
bindsym $mod+Return exec foot
bindsym Ctrl+Shift+Escape exec foot -e top
bindsym $mod+Shift+s exec sh -c 'grim -g "$(slurp)" - | wl-copy'
bindsym Alt+F4 kill
bindsym $mod+Up fullscreen toggle
bindsym $mod+Left move left
bindsym $mod+Right move right
bindsym Alt+Tab focus next
bindsym $mod+l exec swaylock -c 161b22
bindsym $mod+Shift+e exec swaynag -t warning -m 'Sign out?' -B 'Sign out' 'swaymsg exit'
floating_modifier $mod normal

bar {
  swaybar_command waybar
}
exec mako
exec nm-applet --indicator
