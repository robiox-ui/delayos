# DelayOS performance tuning ??desktop responsiveness + gaming

## Memory: zram is primary swap, so swapping to it is cheap -> high swappiness
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Smaller dirty limits = no multi-second stalls when copying big files while gaming
vm.dirty_writeback_centisecs = 1500
# Many games (DayZ, CS2, Star Citizen, Hogwarts Legacy, ...) need lots of memory maps
vm.max_map_count = 2147483642
vm.compaction_proactiveness = 0

## Scheduler / latency
kernel.split_lock_mitigate = 0
kernel.sched_autogroup_enabled = 1

## Network: lower latency for online games
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.core.somaxconn = 8192
net.ipv4.tcp_slow_start_after_idle = 0

## Many open files (esync/fsync, Steam shader cache)
fs.inotify.max_user_watches = 524288
