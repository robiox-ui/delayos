# Transparent huge pages for every process (the kernel's own default in linux-delayos). Measured
# against "madvise" (docs/reports/optimize-rounds.md, round 6): allocation-heavy work is 4 to 14 %
# faster (g++ -4 %, xz -4 %, a Python dict/list workload -14 %), idle memory +6 MB, no change in
# latency or under memory pressure. Page faults never wait for compaction (defrag below), and
# khugepaged only collapses ranges that are mostly in use (max_ptes_none); those two settings
# avoid the stutter and the memory bloat that "always" used to be known for.
w! /sys/kernel/mm/transparent_hugepage/enabled - - - - always
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
# Multi-gen LRU: much better behaviour under memory pressure
w! /sys/kernel/mm/lru_gen/enabled - - - - 5
w! /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
