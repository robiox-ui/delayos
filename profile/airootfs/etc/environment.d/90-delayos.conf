# Korean input everywhere
XMODIFIERS=@im=fcitx
QT_IM_MODULES="wayland;fcitx;ibus"
# Games: use the fastest sync primitives and the Vulkan shader cache on disk
WINEFSYNC=1
WINEESYNC=1
PROTON_ENABLE_NTSYNC=1
MESA_SHADER_CACHE_MAX_SIZE=10G
__GL_SHADER_DISK_CACHE_SIZE=10737418240
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
# AMD: async shader compile with RADV (fewer stutters)
RADV_PERFTEST=gpl
# Make everything use Wayland natively where possible
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=auto
