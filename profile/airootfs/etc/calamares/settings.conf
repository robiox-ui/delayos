---
# TEMUOS_LINUX installer — "Installs next to Windows in a few clicks"
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: copyboot
  module: shellprocess
  config: shellprocess_copyboot.conf
- id: postinstall
  module: shellprocess
  config: shellprocess_postinstall.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - shellprocess@copyboot
  - shellprocess@postinstall
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: temuos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
