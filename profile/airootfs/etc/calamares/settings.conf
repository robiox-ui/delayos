---
# TEMUOS installer (ui-spec §11). Page order = stepper order:
#   Welcome · [Network] · Drive · You · Region (locale + keyboard) · Software · Ready · Progress · Done
# calamares-sidebar.qml / calamares-navigation.qml map these show indexes to the stepper:
#   0 welcomeq, 1 partition, 2 users, 3 locale, 4 keyboard, 5 notesqml (Software), 6 summaryq, 7 exec, 8 finishedq
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: copyboot
  module: shellprocess
  config: shellprocess_copyboot.conf
- id: postinstall
  module: shellprocess
  config: shellprocess_postinstall.conf

sequence:
- show:
  - welcomeq
  - partition
  - users
  - locale
  - keyboard
  - notesqml
  - summaryq
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - shellprocess@copyboot
  - shellprocess@postinstall
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - umount
- show:
  - finishedq

branding: temuos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false