---
# DelayOS installer (ui-spec §11). Page order = stepper order:
#   Welcome · [Network] · Drive · You · Region (locale + keyboard) · Software · Ready · Progress · Done
# calamares-sidebar.qml / calamares-navigation.qml map these show indexes to the stepper:
#   0 welcomeq, 1 partition, 2 users, 3 locale, 4 keyboard, 5 notesqml (Software),
#   6 notesqml@wingames (hidden Windows for anti-cheat games), 7 summaryq, 8 exec, 9 finishedq
# Recovery (docs/recovery.md): delayos_recoverypart makes the hidden recovery partition right after
# the partitions exist. It runs BEFORE delayos_winparts: both take their space from the end of the
# root partition, so the disk becomes  ESP | root | WinSetup (temporary) | Windows | DELAYOS-RE  and
# the 10 GB of the temporary setup partition lie next to the root partition, which gets them back
# when Windows is ready. The other way round the recovery partition sat between the two and that
# space stayed unallocated for good (docs/reports/final-test). delayos_factory takes the @factory snapshot for "이 PC 초기화" as the very last step.
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: copyboot
  module: shellprocess
  config: shellprocess_copyboot.conf
- id: postinstall
  module: shellprocess
  config: shellprocess_postinstall.conf
- id: wingames
  module: notesqml
  config: wingames.conf

sequence:
- show:
  - welcomeq
  - partition
  - users
  - locale
  - keyboard
  - notesqml
  - notesqml@wingames
  - summaryq
- exec:
  - partition
  - delayos_recoverypart
  - delayos_winparts
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - shellprocess@copyboot
  - shellprocess@postinstall
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - delayos_winsetup
  - delayos_factory
  - umount
- show:
  - finishedq

branding: delayos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false