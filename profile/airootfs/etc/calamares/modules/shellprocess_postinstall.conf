---
dontChroot: false
timeout: 600
script:
  # DELAYOS_SOFTWARE = recommended | minimal (installer "Software" page, GlobalStorage)
  # DELAYOS_WINGAMES = 1 when the hidden Windows partitions were made (delayos_winparts always sets it)
  - "env DELAYOS_SOFTWARE=${gs[delayos_software]} DELAYOS_WINGAMES=${gs[delayos_wingames]} /usr/local/bin/delay-postinstall"
  - "rm -rf /tmp/delay-boot"