---
dontChroot: false
# 600 s were enough for the offline steps; the CPU-optimized upgrade (delay-cpu-opt) downloads ~2 GB
# when there is a network: its download is cut off after 40 minutes, the rest needs a few minutes
timeout: 5400
script:
  # DELAYOS_SOFTWARE = recommended | minimal (installer "Software" page, GlobalStorage)
  # DELAYOS_WINGAMES = 1 when the hidden Windows partitions were made (delayos_winparts always sets it)
  - "env DELAYOS_SOFTWARE=${gs[delayos_software]} DELAYOS_WINGAMES=${gs[delayos_wingames]} /usr/local/bin/delay-postinstall"
  - "rm -rf /tmp/delay-boot"
# shown under the progress bar instead of "셸 프로세스 실행하는 중…" (this step can take many minutes:
# it downloads the updates when there is a network)
i18n:
  name: "Setting up drivers and downloading updates (this can take a while)"
  name[ko]: "드라이버를 설정하고 최신 업데이트를 받는 중… (인터넷 속도에 따라 시간이 걸립니다)"
