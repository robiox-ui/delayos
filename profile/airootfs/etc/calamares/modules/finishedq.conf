---
# "Done" page = /etc/calamares/branding/delayos/finishedq.qml
qmlSearch: both
restartNowMode: user-unchecked
# --no-wall: without it "Broadcast message from root@delayos ... The system will reboot now!" is
# printed on the console for a moment before the shutdown splash (seen in the 2026.11.27 ISO test)
restartNowCommand: "systemctl -i --no-wall reboot"
notifyOnFinished: false