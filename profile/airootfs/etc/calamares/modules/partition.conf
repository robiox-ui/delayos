---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"

# "Install next to Windows" is offered first when Windows is found
initialPartitioningChoice: alongside
initialSwapChoice: none
userSwapChoices: [ none, file ]
drawNestedPartitions: false
alwaysShowPartitionLabels: true

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/log
    subvolume: /@log

enableLuksAutomatedPartitioning: true
luksGeneration: luks2
requiredStorage: 20.0
