---
defaultGroups:
  - name: wheel
    must_exist: false
    system: true
  - audio
  - video
  - input
  - storage
  - network
  - gamemode
  - docker
  - kvm
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, live ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "temuos-${cpu}"
