---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1, space_cache=v2, discard=async, commit=120 ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]

# btrfs layout (this key belongs to the mount module, not to partition.conf)
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/log
    subvolume: /@log
  # Snapshots and recovery (docs/recovery.md). Both are outside @ on purpose:
  # /.snapshots  the snapper snapshots of @; a rollback replaces @ and must keep them
  # /var/lib/docker  container images and volumes (the Windows Engine VM disk): not part of a
  #                  system snapshot, never rolled back, removed only by "이 PC 초기화 > 모두 제거"
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /var/lib/docker
    subvolume: /@docker
