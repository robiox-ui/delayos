# zram swap sized by installed RAM (MB): 1x RAM, 1.5x below 3 GB, 2x below 1.5 GB.
# Desktop pages compress about 3:1 with zstd, so even 2x costs at most ~2/3 of RAM when full.
[zram0]
compression-algorithm = zstd
zram-size = ram * (1 + 0.5 * (ram < 3072) + 0.5 * (ram < 1536))
swap-priority = 100
fs-type = swap
