# DelayOS: gmenudbusmenuproxy is not started. It forwards the menus of GTK programs to a Plasma
# global-menu applet; the DelayOS shell has no global menu, so nothing ever asks it.
#
# Back on (for someone who adds the global menu widget):
#   sudo install -D /dev/null /etc/delayos/always-on/gmenu-proxy     then log in again
[Unit]
ConditionPathExists=/etc/delayos/always-on/gmenu-proxy
