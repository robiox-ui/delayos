# KWin, plasmashell and the other session services live in session.slice; apps (and games) in
# app.slice (weight 100), background jobs in background.slice (30). When every core is busy the
# compositor and shell still get their turn first, so the desktop stays responsive. The cpu
# controller is already on for these slices (systemd's own units set weights), so this adds
# no overhead. IOWeight only has an effect with BFQ (HDDs), which is where it matters.
[Slice]
CPUWeight=300
IOWeight=300
