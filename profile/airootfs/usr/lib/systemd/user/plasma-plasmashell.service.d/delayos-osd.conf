# DelayOS (shell-popups): plasmashell loads its OSD from the QML module org.kde.plasma.workspace.osd;
# /usr/lib/delayos/qml provides the DelayOS island-style OSD under that URI (docs/ui-spec.md §6.3).
# Remove this drop-in to get the stock Plasma OSD back.
[Service]
Environment=QML_IMPORT_PATH=/usr/lib/delayos/qml
