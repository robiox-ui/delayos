# DelayOS boot time (docs/reports/optimize-rounds.md, round 3).
#
# Loading scx_lavd (BPF load and verification) costs about 2.5 s of CPU time. Started with the
# rest of multi-user.target it ran exactly while the login screen or, with automatic login, KWin
# and plasmashell were starting, and on a 4-thread CPU the desktop came up 0.2 s later for it.
# plymouth-quit-wait.service ends when the boot splash has handed the screen over, so the
# scheduler is now loaded right after something is on screen instead of before. Until then the
# kernel's own scheduler runs, as it always did for the first 2.6 s. Without Plymouth the unit
# finishes at once and nothing changes. scxctl / D-Bus activation work as before.
[Unit]
After=plymouth-quit-wait.service
