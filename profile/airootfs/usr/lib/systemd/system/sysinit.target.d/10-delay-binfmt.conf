# DelayOS boot time: mount binfmt_misc at the start of the boot instead of on first use.
#
# Stock systemd mounts /proc/sys/fs/binfmt_misc through an automount point. systemd-binfmt.service
# (the Wine handler for .exe, binfmt.d/wine.conf) is the first to touch it, right after the fstab
# mounts. PID 1 starts no mount job while its mount-table events are rate limited (5 per second,
# then up to 1 s of waiting), and those fstab mounts always use the limit up, so the automount
# stayed pending for about 0.9 s. systemd-binfmt is ordered before sysinit.target, and every
# sandboxed service (ProtectKernelTunables= etc. remounts /proc/sys, which waits for the pending
# automount) hangs on it as well, so the whole boot stood still for that time.
#
# Wanting the mount unit here (what "systemctl enable proc-sys-fs-binfmt_misc.mount" does, see its
# [Install] section) mounts it with the other API file systems at 0.1 s of userspace. Measured on
# an installed system: login screen starts 3.55 s after power-on instead of 4.35 s, desktop
# (plasmashell started) 4.88 s instead of 5.43 s.
[Unit]
Wants=proc-sys-fs-binfmt_misc.mount
