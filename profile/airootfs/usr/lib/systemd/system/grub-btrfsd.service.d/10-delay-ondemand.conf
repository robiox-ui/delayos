# DelayOS: the "이전 상태로 부팅" boot menu is refreshed by a path unit instead of a daemon.
#
# grub-btrfsd is a shell loop around inotifywait (three processes, forever) that waits for a
# snapshot to appear in /.snapshots and then rewrites the GRUB snapshot menu.
# delay-grub-btrfs.path lets systemd do the waiting and runs the same refresh
# (delay-grub-btrfs.service) when /.snapshots changes; nothing runs in between.
# The path unit hangs on this unit on purpose: "systemctl enable/disable grub-btrfsd"
# (delay-snapshot, docs/recovery.md) keeps switching the menu refresh on and off.
#
# The original daemon again:  sudo install -D /dev/null /etc/delayos/always-on/grub-btrfsd
#                             sudo systemctl restart grub-btrfsd
[Unit]
Wants=delay-grub-btrfs.path
ConditionPathExists=/etc/delayos/always-on/grub-btrfsd
