# DelayOS boot time: do not hold sysinit.target (and with it the login screen) for binfmt_misc.
#
# systemd-binfmt registers the Wine handler for .exe (binfmt.d/wine.conf). It is ordered before
# sysinit.target and, as a oneshot, counts as started only when it has finished. Its first write
# triggers the binfmt_misc automount, and PID 1 starts no mount job while its mount-table events are
# rate limited (5 per second, 1 s penalty). The seven fstab mounts just before always hit that limit,
# so the whole boot stood still for about 1 s (measured: sysinit.target at 2.25 s instead of 1.3 s
# of userspace, systemd-binfmt.service "986 ms" in systemd-analyze blame).
#
# Type=exec: the unit is up as soon as the helper runs; the registration finishes in the
# background about a second later, long before anybody can start a Windows program.
# RemainAfterExit and ExecStop (unregister at shutdown) of the stock unit stay as they are.
[Service]
Type=exec
