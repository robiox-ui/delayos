# DelayOS: systemd-userdbd (one daemon plus three idle workers) is not started.
#
# It only multiplexes user-record lookups for systemd-homed and JSON user records, neither of
# which DelayOS uses; /etc/passwd users, logind and sudo resolve names without it (nss-systemd
# and the other clients look the records up directly when the multiplexer socket is absent).
#
# Back on:  sudo install -D /dev/null /etc/delayos/always-on/userdbd
#           sudo systemctl start systemd-userdbd.socket
[Unit]
ConditionPathExists=/etc/delayos/always-on/userdbd
