# DelayOS boot time (docs/reports/optimize-rounds.md, round 2).
#
# var-lib-machines.mount is systemd's compatibility unit for an old /var/lib/machines.raw image
# (ConditionPathExists=/var/lib/machines.raw, false on every DelayOS installation). It is wanted
# by systemd-importd.socket, which is part of sockets.target. As a normal mount unit it is ordered
# after local-fs-pre.target, so its start job is first looked at about 0.2 s into userspace. By
# then PID 1 has stopped starting mount jobs for up to a second (mount-table events are rate
# limited to 5 per second; early boot always uses that up), and a mount job is held back before
# its condition is even checked. sockets.target, basic.target and the login screen waited for
# that: about 0.6 s on an NVMe system.
#
# Without the default dependencies the job is processed with the first batch of the boot, where
# the condition check ends it at once. Nothing else changes: when the image file does exist it is
# still mounted, only earlier (the root file system is already writable), and still unmounted at
# shutdown.
[Unit]
DefaultDependencies=no
Conflicts=umount.target
Before=umount.target
