# DelayOS: ModemManager runs only when the PC has a mobile-broadband modem.
#
# Stock: enabled for every boot, and NetworkManager starts it over D-Bus anyway; on a desktop
# without a modem it then sits there for nothing. With these conditions it starts when
#   - a modem is there at boot (any of the device nodes below exists), or
#   - one is plugged in later (udev rule 81-delayos-modem.rules wants this unit).
# Covered: WWAN (MBIM/QMI) modems, USB sticks and phones with AT ports (ttyUSB/ttyACM, which
# also means that an Arduino or a USB serial adapter starts it, exactly as before), Bluetooth
# dial-up (rfcomm). Wi-Fi, Ethernet and phone USB/Bluetooth tethering do not use ModemManager.
#
# Always on again:  sudo install -D /dev/null /etc/delayos/always-on/modemmanager
#                   sudo systemctl start ModemManager
[Unit]
ConditionPathExistsGlob=|/sys/class/wwan/*
ConditionPathExistsGlob=|/dev/cdc-wdm*
ConditionPathExistsGlob=|/dev/ttyUSB*
ConditionPathExistsGlob=|/dev/ttyACM*
ConditionPathExistsGlob=|/dev/rfcomm*
ConditionPathExists=|/etc/delayos/always-on/modemmanager
