# DelayOS: who the kernel kills when memory runs out (docs/reports/optimize-rounds.md, round 4).
#
# systemd runs the user manager with oom_score_adj 100 and its children with 200, so that user
# processes die before system services. The kernel adds that value to a process's share of
# RAM + swap in thousandths. A root-owned process (a container, a virtual machine, a build)
# therefore had to hold more than 20 % of RAM + swap before it became a better victim than
# KWin (200 + 1 %). Measured with four root-owned 1.9 GB processes on a 6 GB machine: the kernel
# killed kwin_wayland, taking every open window with it, and left the four processes alone.
#
# With 0 here and DefaultOOMScoreAdjust=0 for the user manager (user.conf.d/20-delay-oom.conf)
# the kernel goes by size alone, as it does without systemd: the process that fills the memory
# is the one that goes. Essential system services keep their own negative values (udevd -1000,
# journald -250, D-Bus -900, systemd-oomd -900). systemd-oomd, which acts first in most cases,
# works on cgroups and is not affected.
[Service]
OOMScoreAdjust=0
