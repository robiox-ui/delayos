#
# TEMUOS_LINUX build-time pacman.conf
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 10
Color
ILoveCandy
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Our own packages, built by build.sh: linux-temuos kernel, CachyOS pahole, AUR apps
# (calamares, protonup-qt, ...). Listed first so they win over Arch's versions.
# build.sh replaces @LOCALREPO@ with the absolute path.
[temuos-local]
SigLevel = Optional TrustAll
Server = file://@LOCALREPO@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Steam, Wine, 32-bit Vulkan/Mesa drivers
[multilib]
Include = /etc/pacman.d/mirrorlist