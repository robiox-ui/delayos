# DelayOS recovery environment: initramfs that finds <partition>/delayos-re/x86_64/airootfs.sfs
# (archisobasedir=delayos-re archisodevice=UUID=...). No autodetect: it must start on any PC.
# No kms hook: the environment runs with nomodeset on the firmware framebuffer (there is no GPU
# firmware in the image, a GPU driver that fails to start would leave a black screen).
HOOKS=(base udev modconf archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
